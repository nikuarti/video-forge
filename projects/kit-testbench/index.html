<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>kit-testbench</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    body { margin: 0; background: #0b0b0f; }
  </style>
</head>
<body>
  <!-- data-composition-id/width/height/duration are STATIC: read by the
       framework before any script runs. Must match composition.js's
       timeline() call exactly (lib/verify/extract_contract.js enforces this
       as a generic drift check). -->
  <div id="root" data-composition-id="kit-testbench" data-start="0"
       data-width="1920" data-height="1080" data-duration="4"
       style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <!-- Empty placeholders: composition.js's place() owns all styling
         (position, color, size, text) from the same geometry that drives
         the contract, so there is nothing to keep in sync here. -->
    <div id="hero"></div>
    <div id="title"></div>
    <div id="accent"></div>
  </div>

  <!-- Load order: GSAP, then the built kit (copied root-relative by
       lib/gate.sh; renders require root-relative asset paths), then the
       composition. -->
  <script src="motion-kit.js"></script>
  <script src="composition.js"></script>
  <script>
    // Real render entrypoint: build the single paused timeline. HyperFrames
    // seeks it frame-by-frame; window.__motionContract is populated here and
    // must match the headless-extracted contract.
    var __tl = window.buildComposition(window.gsap, window.MotionKit);
    // motion-kit.js already registers this internally (defense in depth,
    // so runtime correctness never depends on this boilerplate), but
    // `hyperframes lint` only statically inspects inline scripts in this
    // file, not the bundled kit — so this explicit, visible line satisfies
    // the linter too. Same object either way.
    window.__timelines = window.__timelines || {};
    window.__timelines["kit-testbench"] = __tl;
  </script>
</body>
</html>
