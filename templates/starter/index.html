<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>starter</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    body { margin: 0; background: #0b0b0f; }
  </style>
</head>
<body>
  <!-- data-composition-id/width/height/duration are STATIC: read by the
       framework before any script runs. Must match composition.js's
       timeline() call exactly (lib/verify/extract_contract.js enforces this
       as a generic drift check). Rename data-composition-id AND
       compositionId in composition.js together when you copy this starter. -->
  <div id="root" data-composition-id="starter" data-start="0"
       data-width="1920" data-height="1080" data-duration="6"
       style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <!-- Empty placeholders: composition.js's place() owns all styling
         (position, color, size, text) from the same geometry that drives
         the contract, so there is nothing to keep in sync here. -->
    <div id="subject"></div>
    <div id="line"></div>
    <div id="payoff"></div>
  </div>

  <!-- Load order: GSAP, then the built kit (copied root-relative by
       lib/gate.sh; renders require root-relative asset paths), then the
       composition. -->
  <script src="motion-kit.js"></script>
  <script src="composition.js"></script>
  <script>
    var __tl = window.buildComposition(window.gsap, window.MotionKit);
    // motion-kit.js registers this internally too (defense in depth); this
    // explicit line satisfies `hyperframes lint`'s static inline-script scan.
    window.__timelines = window.__timelines || {};
    window.__timelines["starter"] = __tl;
  </script>
</body>
</html>
